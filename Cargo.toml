[package]
name = "guildbot"
version = "0.0.1"
edition = "2021"

[dependencies]
tokio = { version = "1.42.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
twilight-cache-inmemory = "0.16.0-rc.1"
twilight-gateway = "0.16.0-rc.1"
twilight-http = "0.16.0-rc.1"
twilight-model = "0.16.0-rc.1"
twilight-validate = "0.16.0-rc.1"
twilight-util = { version = "0.16.0-rc.1", features = ["builder"] }
diesel = { version = "2.2.6", features = ["postgres"] }
diesel-async = { version = "0.5.2", features = ["postgres", "deadpool"] }
deadpool = { version = "0.12.1", default-features = false, features = [
  "managed",
] }
thiserror = "2.0.11"
reqwest = { version = "0.12.15", features = [ "json" ] }
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = "1.0.140"
diesel_migrations = "2.2.0"
